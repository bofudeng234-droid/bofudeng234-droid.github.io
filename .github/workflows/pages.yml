name: Publish 博夫的世界

on:
  push:
    branches: [main]
    paths:
      - site-manifest.json
      - site-part-*.bin
      - site-update.zip
      - site-update.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Restore complete website
        shell: python
        run: |
          import hashlib, json, os, re, shutil, zipfile
          from pathlib import Path, PurePosixPath
          manifest = json.loads(Path('site-manifest.json').read_text())
          archive = Path(os.environ['RUNNER_TEMP']) / 'bofu-world.zip'
          site = Path(os.environ['RUNNER_TEMP']) / 'site'
          with archive.open('wb') as output:
              for part in manifest['parts']:
                  assert re.fullmatch(r'site-part-[0-9]{3}\.bin', part['name'])
                  path = Path(part['name'])
                  assert path.stat().st_size == part['bytes']
                  with path.open('rb') as data:
                      assert hashlib.file_digest(data, 'sha256').hexdigest() == part['sha256']
                  with path.open('rb') as data:
                      shutil.copyfileobj(data, output)
          assert archive.stat().st_size == manifest['archive_bytes']
          with archive.open('rb') as data:
              assert hashlib.file_digest(data, 'sha256').hexdigest() == manifest['archive_sha256']
          site.mkdir()
          with zipfile.ZipFile(archive) as package:
              assert package.testzip() is None
              for member in package.namelist():
                  assert (site / member).resolve().is_relative_to(site.resolve())
              package.extractall(site)
          update_manifest = Path('site-update.json')
          update_archive = Path('site-update.zip')
          if update_manifest.exists() or update_archive.exists():
              assert update_manifest.is_file() and update_archive.is_file(), 'Both update files are required'
              update = json.loads(update_manifest.read_text())
              assert update['archive'] == 'site-update.zip'
              assert update_archive.stat().st_size == update['archive_bytes']
              assert re.fullmatch(r'[0-9a-fA-F]{64}', update['archive_sha256'])
              with update_archive.open('rb') as data:
                  assert hashlib.file_digest(data, 'sha256').hexdigest() == update['archive_sha256'].lower()

              def safe_update_path(name):
                  assert isinstance(name, str) and name
                  assert '\\' not in name and '\x00' not in name
                  relative = PurePosixPath(name)
                  assert relative.parts and not relative.is_absolute() and '..' not in relative.parts
                  target = site.joinpath(*relative.parts)
                  assert target.resolve().is_relative_to(site.resolve())
                  return target

              assert isinstance(update['deleted_files'], list)
              deleted_paths = [safe_update_path(name) for name in update['deleted_files']]
              with zipfile.ZipFile(update_archive) as patch:
                  assert patch.testzip() is None
                  for member in patch.namelist():
                      safe_update_path(member)
                  for target in deleted_paths:
                      if target.exists():
                          assert target.is_file(), 'Update deletions must refer to files'
                          target.unlink()
                  patch.extractall(site)
          assert (site / 'index.html').is_file()
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload complete website
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
